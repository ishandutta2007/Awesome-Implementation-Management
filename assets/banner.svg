<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="320"/>
    <line x1="400" y1="0" x2="400" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="800" y1="0" x2="800" y2="320"/>
    <line x1="1000" y1="0" x2="1000" y2="320"/>
  </g>

  <!-- Dynamic / Animated Background Wave Elements -->
  <path d="M-100 220 Q 200 120 500 220 T 1100 200 T 1300 260" fill="none" stroke="url(#pulseGrad)" stroke-width="3">
    <animate attributeName="d" 
             values="M-100 220 Q 200 120 500 220 T 1100 200 T 1300 260;
                     M-100 200 Q 200 250 500 150 T 1100 240 T 1300 200;
                     M-100 220 Q 200 120 500 220 T 1100 200 T 1300 260" 
             dur="10s" repeatCount="indefinite"/>
  </path>
  <path d="M-100 260 Q 300 300 700 180 T 1300 240" fill="none" stroke="#818cf8" stroke-opacity="0.25" stroke-width="2">
    <animate attributeName="d" 
             values="M-100 260 Q 300 300 700 180 T 1300 240;
                     M-100 240 Q 300 160 700 280 T 1300 220;
                     M-100 260 Q 300 300 700 180 T 1300 240" 
             dur="14s" repeatCount="indefinite"/>
  </path>

  <!-- Floating Glow Orbs in Background -->
  <circle cx="150" cy="80" r="60" fill="#38bdf8" opacity="0.15" filter="url(#glow)">
    <animate attributeName="cy" values="80;110;80" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1050" cy="240" r="80" fill="#c084fc" opacity="0.15" filter="url(#glow)">
    <animate attributeName="cy" values="240;210;240" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- Foreground Title and Subtitle (Guaranteed Clear & Visible) -->
  <text x="600" y="115" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="44" 
        font-weight="800" 
        fill="url(#textGrad)" 
        filter="url(#glow)"
        letter-spacing="1">
    Awesome Implementation Management 🚀
  </text>
  
  <text x="600" y="170" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="20" 
        font-weight="500" 
        fill="#f1f5f9"
        letter-spacing="0.5">
    Curated SaaS Platforms, Professional Services Automation (PSA) &amp; Open-Source Tools
  </text>

  <!-- Key Pill Badges inside Banner -->
  <g transform="translate(600, 230)">
    <g transform="translate(-320, 0)">
      <rect x="0" y="0" width="180" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="90" y="23" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#38bdf8">🤝 Customer Onboarding</text>
    </g>
    <g transform="translate(-110, 0)">
      <rect x="0" y="0" width="220" height="36" rx="18" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
      <text x="110" y="23" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#818cf8">💼 Professional Services / PSA</text>
    </g>
    <g transform="translate(140, 0)">
      <rect x="0" y="0" width="180" height="36" rx="18" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
      <text x="90" y="23" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#c084fc">⚡ Open-Source Stack</text>
    </g>
  </g>
</svg>
